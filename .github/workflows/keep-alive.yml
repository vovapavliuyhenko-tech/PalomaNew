# Бесплатный сервер Render (paloma-pay) засыпает после 15 минут тишины.
# Будим его каждые 10 минут, чтобы оплата и заказы отвечали сразу.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -s -m 90 "https://palomanew.onrender.com/?a=ping" || true
